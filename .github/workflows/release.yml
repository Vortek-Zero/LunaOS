name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: luna-desktop

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: luna-desktop/package-lock.json

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            fuse3

      - name: Install linuxdeploy (AppImage)
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O /tmp/linuxdeploy-x86_64.AppImage
          chmod +x /tmp/linuxdeploy-x86_64.AppImage
          sudo mv /tmp/linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy-x86_64.AppImage

      - name: Install linuxdeploy GTK plugin
        run: |
          wget -q \
            https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk-x86_64.AppImage \
            -O /tmp/linuxdeploy-plugin-gtk-x86_64.AppImage
          chmod +x /tmp/linuxdeploy-plugin-gtk-x86_64.AppImage
          sudo mv /tmp/linuxdeploy-plugin-gtk-x86_64.AppImage /usr/local/bin/linuxdeploy-plugin-gtk-x86_64.AppImage

      - name: Install frontend dependencies
        run: npm ci
        working-directory: luna-desktop

      - name: Build Tauri application
        run: npm run tauri build
        working-directory: luna-desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Prepare artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p artifacts

          # Copy and rename .deb
          cp src-tauri/target/release/bundle/deb/Luna_${VERSION}_amd64.deb \
             artifacts/luna_${VERSION}_amd64.deb

          # Copy and rename .rpm
          cp src-tauri/target/release/bundle/rpm/Luna-${VERSION}-1.x86_64.rpm \
             artifacts/luna-${VERSION}-1.x86_64.rpm

          # Copy and rename AppImage (Tauri uses productName_version_arch.AppImage)
          cp src-tauri/target/release/bundle/appimage/Luna_${VERSION}_x86_64.AppImage \
             artifacts/Luna-${VERSION}-x86_64.AppImage

          # Generate checksums
          cd artifacts
          sha256sum *.deb *.rpm *.AppImage > SHA256SUMS.txt
          cd ..

          echo "=== Generated artifacts ==="
          ls -lh artifacts/
        working-directory: luna-desktop

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            luna-desktop/artifacts/luna_*.deb
            luna-desktop/artifacts/luna-*.rpm
            luna-desktop/artifacts/Luna-*.AppImage
            luna-desktop/artifacts/SHA256SUMS.txt

  build-flatpak:
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flatpak
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08
          flatpak install --user -y \
            org.freedesktop.Sdk.Extension.rust-stable//24.08 \
            org.freedesktop.Sdk.Extension.node20//24.08

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Flatpak
        run: |
          flatpak-builder --user --force-clean \
            --repo=flatpak-repo \
            flatpak-build \
            luna-desktop/flatpak/io.github.milogol2822.Luna.yml

      - name: Create Flatpak bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          flatpak build-bundle \
            flatpak-repo \
            luna-desktop/artifacts/luna-${VERSION}-x86_64.flatpak \
            io.github.milogol2822.Luna

      - name: Upload Flatpak to release
        uses: softprops/action-gh-release@v2
        with:
          files: luna-desktop/artifacts/luna-*.flatpak
